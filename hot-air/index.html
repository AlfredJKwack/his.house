<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanparys hot air balloon</title>
    <style>

        body {
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            font-size: small;
        }

        svg {
            width: auto;
            display: block;
            margin: 0; /* Remove auto margins */
        }

        main {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: flex-start; /* Align items to the left */
        }

        .control-panel {
            position: fixed;
            top: 60px;
            right: 20px;
            background: #f0f0f0;
            padding: 20px;
            border-radius: 8px;
            max-width: max-content;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            z-index: 1000;
            transition: transform 0.3s ease;
            max-height: calc(100vh - 100px); /* Prevent panel from extending beyond viewport */
            overflow-y: auto;                
        }

        .control-panel.hidden {
            transform: translateX(100%);
        }

        .toggle-panel-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1001;
            padding: 8px 16px;
            background: #333;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: opacity 0.3s ease;
        }

        .toggle-panel-btn.panel-visible {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(0);
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-panel label {
            display: flex;
            align-items: center;
            margin: 0.3em 0;
            white-space: nowrap;
        }

        .control-panel input[type="range"] {
            width: 100%;
            margin-left: 10px;
        }

        .control-panel input[type="color"] {
            margin-left: 10px;
        }

        .value {
            font-family: monospace;
            display: none;  ;
        }
    </style>
    <script>

        document.addEventListener('DOMContentLoaded', function() {
            const toggleBtn = document.getElementById('toggle-panel');
            const controlPanel = document.querySelector('.control-panel');

            toggleBtn.addEventListener('click', function() {
                controlPanel.classList.toggle('hidden');
                // toggleBtn.classList.toggle('panel-visible');
            });
        });

        document.addEventListener('DOMContentLoaded', function() {
            // Size control
            const svgWidth = document.getElementById('svg-width');
            const svg = document.querySelector('svg');

            svgWidth.value = svg.clientWidth; // Set initial value to current SVG width
            svg.style.width = svgWidth.value + 'px'; // Set initial width of SVG
            svgWidth.nextElementSibling.textContent = svgWidth.value + 'px'; // Update displayed value                
            
            svgWidth.addEventListener('input', function() {
                svg.style.width = this.value + 'px';
                this.nextElementSibling.textContent = this.value + 'px';
            });
        
            // Stroke width controls
            const envelopeStroke = document.getElementById('envelope-stroke');
            const storkStroke = document.getElementById('stork-stroke');

            envelopeStroke.addEventListener('input', function() {
                document.getElementById('Envelope-Outline').style.strokeWidth = this.value + 'px';
                this.nextElementSibling.textContent = this.value + 'px';
            });

            storkStroke.addEventListener('input', function() {
                const storkParts = document.querySelectorAll('#Stork path');
                storkParts.forEach(part => {
                    part.style.strokeWidth = this.value + 'px';
                });
                this.nextElementSibling.textContent = this.value + 'px';
            });

            // Panel color controls
            document.getElementById('panel-background').addEventListener('input', function() {
                document.getElementById('Panel-background').style.fill = this.value;
            });

            for (let i = 0; i <= 6; i++) {
                document.getElementById(`panel-row-${i}`).addEventListener('input', function() {
                    document.getElementById(`Panel-Row-${i}`).style.fill = this.value;
                });
            }

            // Stork color controls
            document.getElementById('stork-body').addEventListener('input', function() {
                document.getElementById('Stork-Body').style.fill = this.value;
            });

            document.getElementById('stork-left-wing').addEventListener('input', function() {
                document.getElementById('Stork-Left-Wing').style.fill = this.value;
            });

            document.getElementById('stork-right-wing').addEventListener('input', function() {
                document.getElementById('Stork-Right-Wing').style.fill = this.value;
            });
        });
    </script>     
</head>
